spring.application.name=ArmyApp

# ==========================================
# 1. DATABASE CONNECTION
# ==========================================
# Dhyan dein: MySQL server par 'soldier'  naam ka database manually bana hona chahiye.

spring.datasource.url=jdbc:mysql://localhost:3306/soldier
spring.datasource.username=root
spring.datasource.password=830319
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 2. JPA & HIBERNATE 7 CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate 7 ke liye explicit dialect set karein jo error ko bypass karega
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
